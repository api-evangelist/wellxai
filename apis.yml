aid: wellxai
name: Wellxai
description: >-
  Wellx (Wellxai) is a Dubai-based health insurtech company that transforms health insurance
  from reactive to proactive through AI-driven behavior change. Its consumer mobile app pairs
  behavioral science and gamification with wearable integrations (Fitbit, Apple Watch, Whoop)
  so members earn xCoins rewards by hitting health goals, step and sleep challenges, and
  wellness programs, then redeem them with marketplace partners. Wellx also sells to corporates
  and SMEs and partners with brokers and insurers, positioning healthier behavior as the driver
  of better-value health insurance. Surfaced as a 500 Global portfolio company and profiled in
  the API Evangelist network; the company exposes consumer iOS/Android apps backed by a private
  API but publishes no public developer API, SDK, or documentation surface at this time.
